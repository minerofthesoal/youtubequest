name: Build QMOD

# Builds on every push to main or a claude/** branch, on PRs to main, and on
# manual dispatch. To cut a release, run this workflow from the Actions tab and
# fill in the "version" box -- that version is written into qpm.json (which
# CMake and the qmod manifest both read), and the finished .qmod is published
# as a GitHub Release tagged v<version>. Leave the box empty to just build.
#
# Pushing a tag like v0.3.0 does the same thing, taking the version from the
# tag name.
on:
  push:
    branches: [ "main", "claude/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.3.0. Leave empty to build without releasing."
        required: false
        type: string
      prerelease:
        description: "Mark the release as a pre-release"
        required: false
        default: false
        type: boolean

env:
  # Keep in sync with qpm.json's workspace.ndk and README section 3.
  # r27 is the current NDK LTS and is required here: beatsaber-hook 6.x
  # headers use C++20 <ranges> and libc++'s constexpr std::string, neither of
  # which r25c's bundled Clang 14 has -- that combination fails with "'ranges'
  # file not found" and "constexpr constructor never produces a constant
  # expression" deep in compilation, nowhere near an obviously NDK-shaped error.
  NDK_VERSION: r27d
  MOD_OUTPUT_NAME: YouTubeLiveChat

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          # Precedence: the dispatch input, then a v* tag, then whatever
          # qpm.json already says (an ordinary CI build, which releases nothing).
          version=""
          release="false"

          if [ -n "${INPUT_VERSION:-}" ]; then
            version="$INPUT_VERSION"
            release="true"
            echo "Releasing version $version (from the workflow input)"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
            release="true"
            echo "Releasing version $version (from the tag ${GITHUB_REF})"
          fi

          # Written before `qpm restore`, because restore bakes the version
          # into qpm.shared.json and the manifest is rendered from there.
          if [ -n "$version" ]; then
            ./scripts/set-version.sh "$version"
          fi

          resolved=$(python3 -c "import json; print(json.load(open('qpm.json'))['info']['version'])")
          echo "Building version $resolved (release=$release)"
          echo "version=$resolved" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - name: Setup NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          link-to-sdk: true

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v4

      - name: Install QPM (Quest Package Manager)
        run: |
          set -euo pipefail
          # Fetched straight from the release asset rather than through
          # api.github.com: the API path needs a token to avoid anonymous rate
          # limiting, and this URL is stable across releases.
          tmpdir=$(mktemp -d)
          curl -sSfL -o "$tmpdir/qpm.zip" \
            "https://github.com/QuestPackageManager/QPM.CLI/releases/latest/download/qpm-linux-x64.zip"
          unzip -q "$tmpdir/qpm.zip" -d "$tmpdir/extracted"
          qpm_bin=$(find "$tmpdir/extracted" -type f -iname "qpm*" | head -n1)
          if [ -z "$qpm_bin" ]; then
            echo "::error::Couldn't find the qpm binary inside the release archive. Contents:"
            find "$tmpdir/extracted" -type f
            exit 1
          fi
          chmod +x "$qpm_bin"
          sudo mv "$qpm_bin" /usr/local/bin/qpm
          qpm --version

      - name: Cache QPM dependencies
        uses: actions/cache@v4
        with:
          # Only QPM's own content-addressed package cache. Do NOT cache
          # `extern`: that is restore's *output*, and a restore-keys fallback
          # to a stale entry hands `qpm restore` an extern/ it treats as
          # already-populated, silently skipping regeneration of extern.cmake.
          path: ~/.local/share/QPM-RS
          key: ${{ runner.os }}-qpm-${{ hashFiles('qpm.json', 'qpm.shared.json') }}
          restore-keys: |
            ${{ runner.os }}-qpm-

      - name: qpm restore
        run: |
          set -euo pipefail

          # Retried, because restore resolves package versions over the network
          # against qpackages.com on every run and that host returns 502 often
          # enough to fail builds that have nothing wrong with them.
          #
          # The durable fix is committing qpm.shared.json, QPM's lockfile --
          # with one, restore uses the pinned versions and the cached packages
          # instead of asking the registry what exists. QPM says as much itself
          # ("Running in CI and using unlocked resolve, this seems like a bug").
          # Generating it needs registry access, so it has to be done from a
          # machine that has it: `qpm restore && git add -f qpm.shared.json`.
          for attempt in 1 2 3 4 5; do
            if qpm restore; then
              break
            fi
            if [ "$attempt" = "5" ]; then
              echo "::error::qpm restore failed 5 times. If the log says 502 from qpackages.com, the package registry is down -- this is not a problem with the code."
              exit 1
            fi
            delay=$((attempt * 15))
            echo "qpm restore failed (attempt $attempt). Retrying in ${delay}s..."
            sleep "$delay"
          done

          # Fail loudly here rather than letting a broken restore surface later
          # as a confusing "header not found" deep in compilation. qpm writes
          # these to the repo root, not into extern/ -- see CMakeLists.txt.
          if [ ! -f extern.cmake ] || [ ! -f qpm_defines.cmake ]; then
            echo "::error::qpm restore did not produce extern.cmake / qpm_defines.cmake. Check the restore output above."
            exit 1
          fi

      - name: Configure + build
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          cmake -G "Ninja" \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -B build .
          cmake --build build -j"$(nproc)"
          test -f build/libyoutubelivechat.so

      - name: Verify modloader entry points are exported
        run: |
          set -euo pipefail
          # -fvisibility=hidden means a missing visibility attribute produces a
          # .so that loads fine and then does nothing at all. Catch that here
          # instead of on the headset.
          symbols=$(nm -D --defined-only build/libyoutubelivechat.so | awk '{print $3}')
          for sym in setup late_load; do
            if ! echo "$symbols" | grep -qx "$sym"; then
              echo "::error::$sym is not exported from libyoutubelivechat.so -- Scotland2 will not find it."
              exit 1
            fi
          done
          echo "setup and late_load are exported."

      - name: Package .qmod
        run: ./scripts/package-qmod.sh "${MOD_OUTPUT_NAME}.qmod"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MOD_OUTPUT_NAME }}-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: |
            ${{ env.MOD_OUTPUT_NAME }}.qmod
            mod.json
            build/*.so
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.MOD_OUTPUT_NAME }}-${{ needs.build.outputs.version }}-${{ github.sha }}
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Creates the tag at this commit if it doesn't exist yet, which is
          # what makes the "type a version in the Actions tab" flow work
          # without having to tag by hand first.
          tag_name: v${{ needs.build.outputs.version }}
          name: v${{ needs.build.outputs.version }}
          prerelease: ${{ inputs.prerelease == true }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/${{ env.MOD_OUTPUT_NAME }}.qmod
